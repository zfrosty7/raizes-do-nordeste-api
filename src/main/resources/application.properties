server.port=8080

# Banco H2 gravado em arquivo (pasta ./data). Os dados continuam la depois de reiniciar a API.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/raizes;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# O Hibernate (ORM) cria as tabelas sozinho a partir das classes da pasta "model"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-caracteres}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
